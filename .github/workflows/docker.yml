name: Verify & Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: groly-docker-${{ github.event.release.prerelease && 'beta' || 'stable' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm

      - name: Validate release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Release tag must match package.json');
          assert.equal(process.env.RELEASE_PRERELEASE === 'true', version.includes('-'), 'Release channel must match SemVer');
          NODE

      - name: Install and check application
        run: |
          npm ci --ignore-scripts
          npm run prepare
          npm run check
          npm test
          npm audit --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release tags
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=beta,enable=${{ github.event_name == 'release' && github.event.release.prerelease }}

      - name: Build and push candidate only
        id: build
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull the immutable candidate
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "GROLY_TEST_IMAGE=${REGISTRY}/${IMAGE_NAME}@${CANDIDATE_DIGEST}" >> "$GITHUB_ENV"
          docker pull --platform linux/amd64 "${REGISTRY}/${IMAGE_NAME}@${CANDIDATE_DIGEST}"

      - name: Scan the shipped image
        env:
          TRIVY_VERSION: '0.76.0'
        run: |
          set -eu
          curl --fail --location --retry 3 -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --location --retry 3 -o trivy-checksums.txt "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" trivy-checksums.txt | sed "s/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz/trivy.tar.gz/" | sha256sum --check --strict
          tar -xzf trivy.tar.gz trivy
          ./trivy image --scanners vuln --severity HIGH,CRITICAL --format json --output image-security.json --exit-code 1 "$GROLY_TEST_IMAGE"

      - name: Verify fresh installation, direct upgrades and restore
        env:
          GROLY_TEST_REPORT: docker-upgrade-report.json
        run: npm run test:docker

      - name: Install browser test engines
        run: npx --no-install playwright install --with-deps chromium webkit

      - name: Verify existing browser and offline PWA upgrade
        run: npm run test:browser

      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-release-verification
          path: |
            image-security.json
            docker-upgrade-report.json
            playwright-report/
            test-results/

      - name: Verify registry digest promotion
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          tag="${REGISTRY}/${IMAGE_NAME}:verified-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --prefer-index=false --tag "$tag" "${REGISTRY}/${IMAGE_NAME}@${CANDIDATE_DIGEST}"
          test "$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')" = "$CANDIDATE_DIGEST"

      - name: Promote the verified digest to release tags
        if: github.event_name == 'release'
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          test -n "$RELEASE_TAGS"
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker buildx imagetools create --prefer-index=false --tag "$tag" "${REGISTRY}/${IMAGE_NAME}@${CANDIDATE_DIGEST}"
            promoted=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
            test "$promoted" = "$CANDIDATE_DIGEST"
          done <<EOF
          $RELEASE_TAGS
          EOF

name: Build & Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'GitHub draft release ID. Leave empty to verify without publishing.'
        type: string
        required: false
      verification:
        description: 'Verification-only runs. Releases use .github/release.json.'
        type: choice
        required: false
        default: standard
        options:
          - standard
          - full

concurrency:
  group: groly-docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  verify-and-publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      actions: read
      # GitHub exposes unpublished release drafts only to callers with write access.
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm

      - name: Resolve release policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          GROLY_RELEASE_ID: ${{ inputs.release_id }}
          GROLY_VERIFICATION_INPUT: ${{ inputs.verification }}
        run: |
          set -eu
          if [[ -n "$GROLY_RELEASE_ID" ]]; then
            [[ "$GROLY_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
            export GROLY_RELEASE_DRAFT="$RUNNER_TEMP/groly-release.json"
            gh api "repos/$GITHUB_REPOSITORY/releases/$GROLY_RELEASE_ID" > "$GROLY_RELEASE_DRAFT"
          fi
          node scripts/release-policy.mjs >> "$GITHUB_OUTPUT"

      - name: Require successful application checks for this commit
        if: steps.policy.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          check=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs" \
            -f event=push -f branch="$GITHUB_REF_NAME" -f head_sha="$GITHUB_SHA" -f status=success \
            --jq '.workflow_runs[0].html_url // empty')
          if [[ -z "$check" ]]; then
            echo '::error::Application checks must pass for this commit before a release can start.'
            exit 1
          fi
          echo "Application checks passed: $check"

      - name: Install full verification tools and audit dependencies
        if: steps.policy.outputs.verification == 'full'
        run: |
          npm ci --ignore-scripts --no-audit
          npm audit --audit-level=low

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build the candidate image once
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.policy.outputs.localImage }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.policy.outputs.version }}
          cache-from: type=gha,scope=groly-amd64
          cache-to: type=gha,scope=groly-amd64,mode=min

      - name: Record the candidate image ID
        env:
          LOCAL_IMAGE: ${{ steps.policy.outputs.localImage }}
        run: |
          set -eu
          image=$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "GROLY_TEST_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Check that the production image starts
        if: steps.policy.outputs.verification == 'standard'
        run: |
          set -eu
          container=$(docker run -d --network none \
            -e ADMIN_PASSWORD=Release-startup-fixture123! "$GROLY_TEST_IMAGE")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if docker exec "$container" wget -qO- http://127.0.0.1:3000/api/health | grep -q '"status":"ready"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      - name: Scan the shipped image
        if: steps.policy.outputs.verification == 'full'
        env:
          TRIVY_VERSION: '0.76.0'
        run: |
          set -eu
          curl --fail --location --retry 3 -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --location --retry 3 -o trivy-checksums.txt "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" trivy-checksums.txt | sed "s/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz/trivy.tar.gz/" | sha256sum --check --strict
          tar -xzf trivy.tar.gz trivy
          ./trivy image --scanners vuln --format json --output image-security.json --exit-code 1 "$GROLY_TEST_IMAGE"

      - name: Verify fresh installation, direct upgrades and restore
        if: steps.policy.outputs.verification == 'full'
        env:
          GROLY_TEST_REPORT: docker-upgrade-report.json
          GROLY_BASELINES: ${{ github.ref_name == 'codex/groly-1.0' && 'beta' || '' }}
        run: npm run test:docker

      - name: Cache browser test engines
        if: steps.policy.outputs.verification == 'full'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-26.04-${{ hashFiles('node_modules/playwright-core/browsers.json') }}

      - name: Install browser test engines
        if: steps.policy.outputs.verification == 'full'
        run: npx --no-install playwright install --with-deps chromium webkit

      - name: Verify critical browser and offline PWA flows
        if: steps.policy.outputs.verification == 'full'
        run: npm run test:browser -- account-isolation.spec.ts offline.spec.ts tracker-midnight.spec.ts upgrade.spec.ts

      - name: Save verification evidence
        if: always() && steps.policy.outputs.verification == 'full'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-release-verification
          path: |
            image-security.json
            docker-upgrade-report.json
            playwright-report/
            test-results/

      - name: Log in to GitHub Container Registry
        if: steps.policy.outputs.mode == 'release'
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: steps.policy.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GROLY_RELEASE_ID: ${{ inputs.release_id }}
          GIT_TAG: ${{ steps.policy.outputs.gitTag }}
          RELEASE_BRANCH: ${{ steps.policy.outputs.branch }}
          VERSION_TAG: ${{ steps.policy.outputs.versionTag }}
          CHANNEL_TAG: ${{ steps.policy.outputs.channelTag }}
          IMAGE_REPOSITORY: ${{ steps.policy.outputs.repository }}
        run: |
          set -eu
          export GROLY_RELEASE_DRAFT="$RUNNER_TEMP/groly-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$GROLY_RELEASE_ID" > "$GROLY_RELEASE_DRAFT"
          node scripts/release-policy.mjs > /dev/null
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_BRANCH" --jq .object.sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo '::error::The release branch moved during verification. Start a release for the intended commit.'
            exit 1
          fi
          git_tag=$(git ls-remote --tags origin "refs/tags/$GIT_TAG")
          if [[ -n "$git_tag" && "$git_tag" != "$GITHUB_SHA"$'\t'"refs/tags/$GIT_TAG" ]]; then
            echo '::error::The Git tag already points to another commit.'
            exit 1
          fi
          if docker buildx imagetools inspect "$VERSION_TAG" --raw > "$RUNNER_TEMP/groly-manifest.json" 2> "$RUNNER_TEMP/groly-registry-error"; then
            jq -e --arg id "$GROLY_TEST_IMAGE" '.config.digest == $id' "$RUNNER_TEMP/groly-manifest.json" > /dev/null
          else
            grep -Eqi 'manifest unknown|:[[:space:]]+not found' "$RUNNER_TEMP/groly-registry-error" || { cat "$RUNNER_TEMP/groly-registry-error" >&2; exit 1; }
            docker tag "$GROLY_TEST_IMAGE" "$VERSION_TAG"
            docker push "$VERSION_TAG"
          fi
          docker buildx imagetools inspect "$VERSION_TAG" --raw | jq -e --arg id "$GROLY_TEST_IMAGE" '.config.digest == $id' > /dev/null
          digest=$(docker buildx imagetools inspect "$VERSION_TAG" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --prefer-index=false --tag "$CHANNEL_TAG" "${IMAGE_REPOSITORY}@${digest}"
          test "$(docker buildx imagetools inspect "$CHANNEL_TAG" --format '{{.Manifest.Digest}}')" = "$digest"
          printf 'Published tested image as `%s` and `%s` (%s). GitHub draft `%s` is ready to publish.\n' \
            "$VERSION_TAG" "$CHANNEL_TAG" "$digest" "$GIT_TAG" >> "$GITHUB_STEP_SUMMARY"

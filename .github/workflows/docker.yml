name: Groly CI
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Verify image · {0}', github.ref_name)
      || startsWith(github.event.head_commit.message, 'release: v') && (github.ref_name == 'main' && 'Stable release' || 'Beta release')
      || format('Application checks · {0}', github.ref_name) }}

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      verification:
        description: 'Image verification only'
        type: choice
        default: standard
        options: [standard, full]

permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
defaults:
  run:
    shell: bash

jobs:
  check:
    name: Application checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Check release policy and migrations
        run: |
          npm ci --ignore-scripts --no-audit
          npm run test:release
          npm run test:dependencies
      - name: Check application
        run: |
          npm run prepare
          npm run check
          npm test

  image:
    name: Build and verify image
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
      artifact: ${{ steps.archive.outputs.artifact-id }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm

      - name: Resolve release policy
        id: policy
        env:
          GROLY_VERIFICATION_INPUT: ${{ inputs.verification }}
        run: node scripts/release-policy.mjs >> "$GITHUB_OUTPUT"

      - name: Install full verification tools and audit dependencies
        if: steps.policy.outputs.verification == 'full'
        run: |
          npm ci --ignore-scripts --no-audit
          npm audit --audit-level=low

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build the candidate image once
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/candidate.tar
          provenance: false
          sbom: false
          tags: ${{ steps.policy.outputs.localImage }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.policy.outputs.version }}
          cache-from: type=gha,scope=groly-amd64
          cache-to: type=gha,scope=groly-amd64,mode=min

      - name: Load the candidate for verification
        id: candidate
        env:
          LOCAL_IMAGE: ${{ steps.policy.outputs.localImage }}
        run: |
          command -v skopeo || { sudo apt-get update && sudo apt-get install -y skopeo; }
          archive="oci-archive:$RUNNER_TEMP/candidate.tar"
          digest=$(skopeo inspect --raw "$archive" | sha256sum | cut -d' ' -f1)
          echo "digest=sha256:$digest" >> "$GITHUB_OUTPUT"
          skopeo copy "$archive" "docker-daemon:$LOCAL_IMAGE"
          image=$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "GROLY_TEST_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Check that the production image starts
        if: steps.policy.outputs.verification == 'standard'
        run: |
          set -eu
          container=$(docker run -d --network none \
            -e ADMIN_PASSWORD=Release-startup-fixture123! "$GROLY_TEST_IMAGE")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if docker exec "$container" wget -qO- http://127.0.0.1:3000/api/health | grep -q '"status":"ready"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      - name: Scan the shipped image
        if: steps.policy.outputs.verification == 'full'
        env:
          TRIVY_VERSION: '0.76.0'
        run: |
          set -eu
          curl --fail --location --retry 3 -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --location --retry 3 -o trivy-checksums.txt "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" trivy-checksums.txt | sed "s/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz/trivy.tar.gz/" | sha256sum --check --strict
          tar -xzf trivy.tar.gz trivy
          ./trivy image --scanners vuln --format json --output image-security.json --exit-code 1 "$GROLY_TEST_IMAGE"

      - name: Verify fresh installation, direct upgrades and restore
        if: steps.policy.outputs.verification == 'full'
        env:
          GROLY_TEST_REPORT: docker-upgrade-report.json
          GROLY_BASELINES: ${{ github.ref_name == 'codex/groly-1.0' && 'beta' || '' }}
        run: npm run test:docker

      - name: Cache browser test engines
        if: steps.policy.outputs.verification == 'full'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-26.04-${{ hashFiles('node_modules/playwright-core/browsers.json') }}

      - name: Install browser test engines
        if: steps.policy.outputs.verification == 'full'
        run: npx --no-install playwright install --with-deps chromium webkit

      - name: Verify critical browser and offline PWA flows
        if: steps.policy.outputs.verification == 'full'
        run: npm run test:browser -- account-isolation.spec.ts offline.spec.ts tracker-midnight.spec.ts upgrade.spec.ts

      - name: Save verification evidence
        if: always() && steps.policy.outputs.verification == 'full'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-release-verification-${{ github.run_attempt }}
          path: |
            image-security.json
            docker-upgrade-report.json
            playwright-report/
            test-results/

      - name: Preserve the verified image for publication
        if: github.event_name == 'push'
        id: archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tested-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish v${{ needs.image.outputs.version }}
    needs: image
    if: github.event_name == 'push'
    concurrency:
      group: groly-publish-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.image.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/verified
      - uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.image.outputs.digest }}
          OCI_ARCHIVE: ${{ runner.temp }}/verified/candidate.tar
        run: |
          command -v skopeo || { sudo apt-get update && sudo apt-get install -y skopeo; }
          node scripts/publish-image.mjs

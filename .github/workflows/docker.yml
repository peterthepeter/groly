name: Verify & Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: groly-docker-${{ github.event_name == 'workflow_dispatch' && format('verify-{0}', github.ref) || (github.event.release.prerelease && 'beta' || 'stable') }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm

      - name: Resolve release policy
        id: policy
        run: node scripts/release-policy.mjs >> "$GITHUB_OUTPUT"

      - name: Install and check application
        run: |
          npm ci --ignore-scripts
          npm run prepare
          npm run check
          npm test
          npm run test:release
          npm audit --audit-level=high

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load local image (manual verification)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.policy.outputs.localImage }}
          cache-from: type=gha

      - name: Select the immutable local image
        if: github.event_name == 'workflow_dispatch'
        env:
          LOCAL_IMAGE: ${{ steps.policy.outputs.localImage }}
        run: |
          set -eu
          image=$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')
          echo "GROLY_TEST_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Build untagged release candidate by digest
        if: github.event_name == 'release'
        id: candidate
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ steps.policy.outputs.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.policy.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull the immutable release candidate
        if: github.event_name == 'release'
        env:
          IMAGE_REPOSITORY: ${{ steps.policy.outputs.repository }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -eu
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "GROLY_TEST_IMAGE=${IMAGE_REPOSITORY}@${CANDIDATE_DIGEST}" >> "$GITHUB_ENV"
          docker pull --platform linux/amd64 "${IMAGE_REPOSITORY}@${CANDIDATE_DIGEST}"

      - name: Scan the shipped image
        env:
          TRIVY_VERSION: '0.76.0'
        run: |
          set -eu
          curl --fail --location --retry 3 -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --location --retry 3 -o trivy-checksums.txt "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" trivy-checksums.txt | sed "s/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz/trivy.tar.gz/" | sha256sum --check --strict
          tar -xzf trivy.tar.gz trivy
          ./trivy image --scanners vuln --severity HIGH,CRITICAL --format json --output image-security.json --exit-code 1 "$GROLY_TEST_IMAGE"

      - name: Verify fresh installation, direct upgrades and restore
        env:
          GROLY_TEST_REPORT: docker-upgrade-report.json
        run: npm run test:docker

      - name: Install browser test engines
        run: npx --no-install playwright install --with-deps chromium webkit

      - name: Verify existing browser and offline PWA upgrade
        run: npm run test:browser

      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-release-verification
          path: |
            image-security.json
            docker-upgrade-report.json
            playwright-report/
            test-results/

      - name: Promote the verified digest to version and channel
        if: github.event_name == 'release'
        env:
          VERSION_TAG: ${{ steps.policy.outputs.versionTag }}
          CHANNEL_TAG: ${{ steps.policy.outputs.channelTag }}
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          set -eu
          test -n "$VERSION_TAG"
          test -n "$CHANNEL_TAG"
          # Confirm the version tag first, then update exactly one channel.
          for tag in "$VERSION_TAG" "$CHANNEL_TAG"; do
            docker buildx imagetools create --prefer-index=false --tag "$tag" "$GROLY_TEST_IMAGE"
            promoted=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
            test "$promoted" = "$CANDIDATE_DIGEST"
          done

services:
  groly:
    image: ghcr.io/peterthepeter/groly:latest
    # Zum lokalen Bauen: build: .
    ports:
      - "3000:3000"
    volumes:
      - groly-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/data/groly.db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ORIGIN=${ORIGIN:-}
      - KEEP_CHECKED_ITEMS=${KEEP_CHECKED_ITEMS:-false}
      # Set to true to keep checked-off items in all lists. The default is 60-day cleanup.
      # Web Push (VAPID) - generate keys with:
      # node --input-type=module -e "import { generateVAPIDKeys } from 'web-push'; console.log(generateVAPIDKeys())"
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@groly.local}
      - PUBLIC_VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PORT:-3000}/api/health"]
      start_period: 10m
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  groly-data:

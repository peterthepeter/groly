# Edit the data path, password, and HTTPS origin before installing via YAML.
# This is for TrueNAS Docker-based Apps, not TrueNAS CORE or Kubernetes Apps.
services:
  groly:
    image: ghcr.io/peterthepeter/groly:latest
    ports:
      - "3000:3000"
    volumes:
      # Create this dedicated directory/dataset first; replace tank with your pool.
      - /mnt/tank/apps/groly/data:/app/data
    environment:
      NODE_ENV: production
      DATABASE_URL: /app/data/groly.db
      ADMIN_USERNAME: "admin"
      # Required on first start. Use $$ for each literal $ in inline YAML values.
      ADMIN_PASSWORD: ""
      ORIGIN: "https://groly.example.com"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-3000}/api/health"]
      start_period: 10m
      interval: 30s
      timeout: 5s
      retries: 3
